appId: dev.troy.app
productName: Troy
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{e2e,scripts,packaging,test-results,.github}/**'
  - '!{install.sh,uninstall.sh}'
  # Host-arch build of node-pty; each package uses the matching prebuild instead.
  - '!node_modules/node-pty/build/**'
asarUnpack:
  - resources/**
  - node_modules/node-pty/prebuilds/**
win:
  executableName: troy
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Ad-hoc signed and not notarized: free, and Apple Silicon runs it instead of calling it damaged.
mac:
  identity: '-'
  hardenedRuntime: false
  notarize: false
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
linux:
  target:
    - AppImage
    - deb
  maintainer: troy
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
afterPack: scripts/after-pack.mjs
publish:
  provider: github
  owner: m44abdel
  repo: troy

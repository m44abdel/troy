name: Release

# Push a tag like v1.2.0 to build both Mac architectures and attach them to a
# draft GitHub release. Publish the draft to make install.sh pick it up.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

# Push a tag like v1.2.0 to build both Mac architectures and attach them to a
# draft GitHub release. Publish the draft to make install.sh pick it up.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      # Both arches upload at once and each would create the release, leaving two drafts that
      # split the files between them. A draft made up front is the one both find.
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Troy ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
